<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Type — Eyebrow Pattern</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:#fff}
  .stack{display:flex;flex-direction:column;gap:28px}
  .pair{display:flex;flex-direction:column;gap:4px;text-align:center}
  .eb{font:400 16px/20px var(--font-sans);color:var(--gc-pink)}
  .ti{font:700 24px/28px var(--font-sans);color:var(--gc-ink)}
  .meta{font:400 11px/14px var(--font-sans);color:var(--gc-gray-400);text-align:center;letter-spacing:.02em;text-transform:uppercase}
</style></head><body>
<div class="stack">
  <div class="meta">Signature pattern: pink eyebrow + ink headline, 4 px apart</div>
  <div class="pair"><div class="eb">¿Dónde podés comprar?</div><div class="ti">Nuestros comercios</div></div>
  <div class="pair"><div class="eb">¿Cómo funciona?</div><div class="ti">Comprá en 3 pasos</div></div>
</div>
</body></html>
