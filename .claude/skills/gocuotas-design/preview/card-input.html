<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Card & Input</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:20px;background:#fff;display:flex;flex-direction:column;gap:16px;font-family:var(--font-sans);color:var(--gc-ink)}
  .step{background:var(--gc-surface);border-radius:8px;box-shadow:var(--shadow-card);padding:24px;display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;max-width:360px}
  .step .t{font:700 16px/20px var(--font-sans)}
  .step .b{font:400 14px/18px var(--font-sans)}
  .search{background:var(--gc-surface);border-radius:100px;box-shadow:var(--shadow-card);padding:8px 8px 8px 24px;display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:420px}
  .search .ph{font:400 12px/16px var(--font-sans);color:var(--gc-gray-400)}
</style></head><body>
<div class="step"><div class="t">¡Comprás y listo!</div><div class="b">En cuotas, sin interés con tu tarjeta de débito o prepaga.</div></div>
<div class="search"><div class="ph">¿Qué te gustaría comprar?</div><button class="gc-btn gc-btn--primary" style="height:36px">Buscar</button></div>
</body></html>
