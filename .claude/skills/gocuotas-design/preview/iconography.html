<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Iconography</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>body{margin:0;padding:24px;background:#fff;font-family:var(--font-sans);color:var(--gc-ink)}
  .grid{display:grid;grid-template-columns:repeat(8,1fr);gap:14px;text-align:center}
  .ico{display:flex;flex-direction:column;gap:4px;align-items:center}
  i{font-size:24px;color:var(--gc-pink)}
  .n{font:400 10px/12px var(--font-sans);color:var(--gc-gray-400)}
  .h{grid-column:1/-1;font:400 11px/14px var(--font-sans);color:var(--gc-gray-400);letter-spacing:.02em;text-transform:uppercase;text-align:left}
</style></head><body>
<div class="grid">
  <div class="h">Bootstrap Icons 1.11 · 24 px · currentColor</div>
  <div class="ico"><i class="bi bi-arrow-right-circle"></i><div class="n">arrow-right-circle</div></div>
  <div class="ico"><i class="bi bi-arrow-left-short"></i><div class="n">arrow-left-short</div></div>
  <div class="ico"><i class="bi bi-arrow-right-short"></i><div class="n">arrow-right-short</div></div>
  <div class="ico"><i class="bi bi-question-circle"></i><div class="n">question-circle</div></div>
  <div class="ico"><i class="bi bi-star-fill"></i><div class="n">star-fill</div></div>
  <div class="ico"><i class="bi bi-calendar4-event"></i><div class="n">calendar4-event</div></div>
  <div class="ico"><i class="bi bi-play-fill"></i><div class="n">play-fill</div></div>
  <div class="ico"><i class="bi bi-search"></i><div class="n">search</div></div>
</div>
</body></html>
