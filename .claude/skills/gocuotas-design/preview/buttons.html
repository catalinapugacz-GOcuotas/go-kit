<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:#fff;display:flex;flex-direction:column;gap:16px}
  .pink{background:var(--gc-pink);padding:14px;border-radius:8px}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .label{font:400 11px/14px var(--font-sans);color:var(--gc-gray-400);letter-spacing:.02em;text-transform:uppercase;width:100%}
</style></head><body>
<div class="row">
  <div class="label">Primary · Secondary · Tertiary · Accent</div>
  <button class="gc-btn gc-btn--primary">Crear mi cuenta</button>
  <button class="gc-btn gc-btn--secondary">Buscar</button>
  <button class="gc-btn gc-btn--tertiary">Ayuda</button>
  <button class="gc-btn gc-btn--accent">Registrarme gratis</button>
</div>
<div class="pink row">
  <div class="label" style="color:#ffd9e7">On pink hero — SecondaryLight</div>
  <button class="gc-btn gc-btn--secondary-light">Ingresar</button>
  <button class="gc-btn gc-btn--accent">Registrarme gratis</button>
</div>
</body></html>
