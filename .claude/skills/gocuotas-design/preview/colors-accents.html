<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Colors — Accents</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:#fff}
  .row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
  .sw{display:flex;flex-direction:column;gap:6px}
  .chip{height:56px;border-radius:8px;box-shadow:var(--shadow-card)}
  .name{font:500 12px/16px var(--font-sans);color:var(--gc-ink)}
  .hex{font:400 11px/14px var(--font-sans);color:var(--gc-gray-400);font-variant-numeric:tabular-nums}
  .role{font:400 11px/14px var(--font-sans);color:var(--gc-gray-400)}
</style></head><body>
<div class="row">
  <div class="sw"><div class="chip" style="background:var(--gc-orange)"></div><div class="name">Orange</div><div class="hex">#EF9300</div><div class="role">"Sin interés" tag</div></div>
  <div class="sw"><div class="chip" style="background:var(--gc-orange-soft)"></div><div class="name">Yellow</div><div class="hex">#FDBC46</div><div class="role">Gradient end</div></div>
  <div class="sw"><div class="chip" style="background:var(--gc-green)"></div><div class="name">Green</div><div class="hex">#00AA31</div><div class="role">Success / paid</div></div>
  <div class="sw"><div class="chip" style="background:var(--gc-blue)"></div><div class="name">Blue</div><div class="hex">#00A1DF</div><div class="role">Info</div></div>
  <div class="sw"><div class="chip" style="background:var(--gc-violet)"></div><div class="name">Violet</div><div class="hex">#5B19AE</div><div class="role">GOtarjeta</div></div>
</div>
</body></html>
