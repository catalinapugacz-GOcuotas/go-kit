<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Colors — Neutrals</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:#fff}
  .row{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
  .sw{display:flex;flex-direction:column;gap:6px}
  .chip{height:56px;border-radius:8px;box-shadow:var(--shadow-card)}
  .name{font:500 12px/16px var(--font-sans);color:var(--gc-ink)}
  .hex{font:400 11px/14px var(--font-sans);color:var(--gc-gray-400);font-variant-numeric:tabular-nums}
</style></head><body>
<div class="row">
  <div class="sw"><div class="chip" style="background:var(--gc-ink)"></div><div class="name">Ink</div><div class="hex">#1C263F</div></div>
  <div class="sw"><div class="chip" style="background:var(--gc-ink-soft)"></div><div class="name">Ink Soft</div><div class="hex">#333C4C</div></div>
  <div class="sw"><div class="chip" style="background:var(--gc-ink-muted)"></div><div class="name">Ink Muted</div><div class="hex">#3D3D3E</div></div>
  <div class="sw"><div class="chip" style="background:var(--gc-gray-500)"></div><div class="name">Gray 500</div><div class="hex">#6C757D</div></div>
  <div class="sw"><div class="chip" style="background:var(--gc-gray-400)"></div><div class="name">Gray 400</div><div class="hex">#828282</div></div>
  <div class="sw"><div class="chip" style="background:var(--gc-surface);border:1px solid #eceff2"></div><div class="name">Surface</div><div class="hex">#F8F9FA</div></div>
</div>
</body></html>
