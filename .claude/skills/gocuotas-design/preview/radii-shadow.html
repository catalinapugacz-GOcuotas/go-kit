<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Radii & Shadow</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:#fff;display:flex;gap:16px;flex-wrap:wrap}
  .box{background:var(--gc-surface);box-shadow:var(--shadow-card);padding:18px;min-width:130px;display:flex;flex-direction:column;gap:6px}
  .name{font:500 13px/16px var(--font-sans);color:var(--gc-ink)}
  .val{font:400 11px/14px var(--font-sans);color:var(--gc-gray-400);font-variant-numeric:tabular-nums}
</style></head><body>
<div class="box" style="border-radius:4px"><div class="name">Radius SM</div><div class="val">4px</div></div>
<div class="box" style="border-radius:8px"><div class="name">Radius MD · Cards</div><div class="val">8px</div></div>
<div class="box" style="border-radius:16px"><div class="name">Radius LG</div><div class="val">16px</div></div>
<div class="box" style="border-radius:100px"><div class="name">Pill · Buttons</div><div class="val">999999px</div></div>
<div class="box" style="border-radius:8px"><div class="name">Card Shadow</div><div class="val">3px 3px 3px rgba(209,213,223,.3)</div></div>
</body></html>
