<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Type — Display & Headings</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:#fff}
  .stack{display:flex;flex-direction:column;gap:16px}
  .meta{font:400 11px/14px var(--font-sans);color:var(--gc-gray-400);letter-spacing:.02em;text-transform:uppercase}
  .row{display:flex;flex-direction:column;gap:4px}
  .h1-size{font-family:var(--font-sans);font-weight:700;font-size:44px;line-height:48px;color:var(--gc-ink)}
</style></head><body>
<div class="stack">
  <div class="row"><div class="meta">Display · 60/64 Bold · Poppins</div><div class="h1-size" style="font-size:48px;line-height:52px">Comprá en cuotas sin interés</div></div>
  <div class="row"><div class="meta">H1 · 36/42 Bold</div><div style="font:700 36px/42px var(--font-sans);color:var(--gc-ink)">Gocuoteá todos los servicios</div></div>
  <div class="row"><div class="meta">H2 · 24/28 Bold</div><div style="font:700 24px/28px var(--font-sans);color:var(--gc-ink)">Nuestros comercios</div></div>
</div>
</body></html>
