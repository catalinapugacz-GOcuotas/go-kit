<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>FAQ States</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>body{margin:0;padding:20px;background:#fff;display:flex;flex-direction:column;gap:14px;font-family:var(--font-sans);color:var(--gc-ink)}
  .q{display:flex;align-items:center;gap:12px;padding:16px 20px}
  .q.closed{background:#fff;border-bottom:1px solid #E9ECEF}
  .q.open-head{background:var(--gc-bg-info);border-radius:8px 8px 0 0}
  .q .t{flex:1;font:500 16px/20px var(--font-sans)}
  .q i{color:var(--gc-pink);font-size:20px}
  .ans{background:var(--gc-bg-info-soft);border-radius:0 0 8px 8px;padding:14px 20px;font:400 14px/20px var(--font-sans);color:var(--gc-ink-soft)}
</style></head><body>
<div class="q closed"><i class="bi bi-question-circle"></i><div class="t">¿Cómo me registro?</div><i class="bi bi-plus"></i></div>
<div>
  <div class="q open-head"><i class="bi bi-question-circle"></i><div class="t">¿Necesito tarjeta de crédito?</div><i class="bi bi-dash"></i></div>
  <div class="ans">No. Gocuoteás con tu tarjeta de débito o prepaga. No hay intereses y las cuotas son fijas.</div>
</div>
</body></html>
