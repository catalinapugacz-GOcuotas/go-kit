<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>GOcuotas — Landing</title>
<meta name="viewport" content="width=1440">
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
  html, body { margin: 0; padding: 0; overflow-x: hidden; }
  body { background: #fff; color: var(--gc-ink); font-family: var(--font-sans); min-width: 1440px; }
  a { color: inherit; }
</style>
</head>
<body>
<div id="root" data-screen-label="Landing · Desktop"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="./Logo.jsx"></script>
<script type="text/babel" src="./Nav.jsx"></script>
<script type="text/babel" src="./Hero.jsx"></script>
<script type="text/babel" src="./HowItWorks.jsx"></script>
<script type="text/babel" src="./MerchantSearch.jsx"></script>
<script type="text/babel" src="./ProductFamily.jsx"></script>
<script type="text/babel" src="./AppDownload.jsx"></script>
<script type="text/babel" src="./Testimonials.jsx"></script>
<script type="text/babel" src="./FAQ.jsx"></script>
<script type="text/babel" src="./Footer.jsx"></script>

<script type="text/babel">
  function App() {
    return (
      <div>
        <Hero />
        <HowItWorks />
        <MerchantSearch />
        <ProductFamily />
        <AppDownload />
        <Testimonials />
        <FAQ />
        <Footer />
      </div>
    );
  }
  // Wait a tick for all script tags to transpile
  setTimeout(() => {
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  }, 120);
</script>
</body>
</html>
